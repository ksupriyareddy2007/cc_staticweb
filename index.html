<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Static Web App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #333;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 600px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Web App</h1>
  </header>

  <main>
    <h2>Welcome!</h2>
    <p>This is a simple static web application.</p>

    <button onclick="showMessage()">Click Me</button>

    <p id="message"></p>
  </main>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Hello! You clicked the button 🎉";
    }
  </script>

</body>
</html>
